<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CabinPlay</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-wall="aurora">

<!-- Texts are filled in by shell.js from i18n.js: data-i18n sets the content,
     data-i18n-title the tooltip. -->

<aside id="dock">
  <div id="clock" data-i18n-title="dragTitle">
    <div id="clock-time">--:--</div>
    <div id="clock-date"></div>
  </div>
  <div id="link"><span id="link-dot"></span><span id="link-text"></span></div>
  <div id="dock-apps"></div>
  <div id="dock-nav" class="dock-seg" hidden>
    <button id="dock-back" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <span class="seg-line"></span>
    <button id="dock-forward" data-i18n-title="forward"><svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
  </div>
  <!-- Fullscreen only shows for apps that have it; side by side is always there. The
       tooltips carry the shortcuts and are set by shell.js. -->
  <div id="dock-tools" class="dock-seg">
    <button id="dock-fullscreen" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <span class="seg-line"></span>
    <button id="dock-split"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M12 5v14"/></svg></button>
  </div>
  <button id="dock-home" class="dock-btn">
    <svg viewBox="0 0 24 24" class="filled">
      <rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/>
      <rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/>
    </svg>
  </button>
</aside>

<main id="home">
  <section id="widgets">
    <div id="now-playing" class="card">
      <div class="card-label" data-i18n="nowPlaying"></div>
      <div class="np-body">
        <div id="np-art"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
        <div class="np-text">
          <div id="np-title"></div>
          <div id="np-sub"></div>
        </div>
      </div>
      <div class="np-progress"><div id="np-bar"></div></div>
      <div class="np-times"><span id="np-pos">0:00</span><span id="np-dur">0:00</span></div>
      <div class="np-controls">
        <button data-media="prev"><svg viewBox="0 0 24 24" class="filled"><path d="M6 5h2.4v14H6zM20 5.5v13L9.5 12z"/></svg></button>
        <button data-media="playpause" id="np-play"><svg viewBox="0 0 24 24" class="filled"><path id="np-play-icon" d="M7 4.5v15L20 12z"/></svg></button>
        <button data-media="next"><svg viewBox="0 0 24 24" class="filled"><path d="M15.6 5H18v14h-2.4zM4 5.5v13L14.5 12z"/></svg></button>
      </div>
    </div>
    <div id="day-card" class="card">
      <div id="day-name"></div>
      <div id="day-date"></div>
    </div>
    <!-- Takes the day's place while there is news about an update (shell.js). -->
    <div id="update-card" class="card" hidden>
      <div id="upd-icon"><svg viewBox="0 0 24 24"><path id="upd-icon-path" d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg></div>
      <div class="upd-text"><div id="upd-title"></div><div id="upd-sub"></div></div>
      <button id="upd-now" class="update-now" data-i18n="updNow" hidden></button>
      <button id="upd-close">×</button>
    </div>
  </section>

  <section id="grid"></section>
</main>

<section id="maps" hidden>
  <div id="map-speed" class="map-card">
    <div class="speed-now"><span id="map-speed-value">0</span><small data-i18n="speedUnit"></small></div>
    <div id="map-limit" hidden>50</div>
  </div>
  <div id="map-route" class="map-card">
    <div class="route-main"><span id="map-eta">--:--</span><small data-i18n="arrival"></small></div>
    <div class="route-rest"><span id="map-remaining"></span><span id="map-distance"></span></div>
  </div>
  <div id="map-status"></div>
</section>

<!-- Mirrors app: the game renders the views, the plugin shows them through the key-coloured
     tiles. The tiles' places match MIRRORS in tools/build_mod.py (see CAMERAS in shell.js). -->
<section id="mirrors" hidden>
  <div id="mirror-tiles"></div>
  <div id="mirror-info" class="map-card">
    <div id="mirror-title" data-i18n="mirrors"></div>
    <div id="mirror-hint" data-i18n="camHint"></div>
    <div id="mirror-note" data-i18n="camFrontNote"></div>
  </div>
  <div id="mirror-bar" hidden>
    <span id="mirror-name"></span>
  </div>
  <div class="mirror-actions">
    <button id="mirror-all" class="map-card map-switch" hidden>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="13" width="7" height="7" rx="1.5"/><rect x="14" y="13" width="7" height="7" rx="1.5"/></svg>
      <span data-i18n="allMirrors"></span>
    </button>
  </div>
  <div id="mirror-status"></div>
</section>

<!-- Truck page: everything comes from the game's telemetry through the plugin. The plan
     view is coloured part by part like a car listing's damage chart (see renderTruck). -->
<section id="truck" hidden>
  <div id="rig-card" class="card">
    <div class="rig-head">
      <div class="rig-title-box">
        <div id="rig-title"></div>
        <div id="rig-sub"></div>
      </div>
      <div id="rig-chips"></div>
    </div>
    <svg id="rig" viewBox="0 0 600 172" aria-hidden="true">
      <g id="rig-trailer">
        <rect data-part="trailer-chassis" x="10" y="34" width="386" height="104" rx="8"/>
        <rect data-part="trailer-chassis" x="392" y="73" width="38" height="26" rx="4"/>
        <rect data-part="trailer-body" x="17" y="41" width="372" height="90" rx="5"/>
        <rect data-part="trailer-cargo" class="cargo" x="38" y="55" width="330" height="62" rx="4"/>
        <g data-part="trailer-wheels"><rect x="44" y="20" width="26" height="12" rx="3"/><rect x="76" y="20" width="26" height="12" rx="3"/><rect x="108" y="20" width="26" height="12" rx="3"/>
          <rect x="44" y="140" width="26" height="12" rx="3"/><rect x="76" y="140" width="26" height="12" rx="3"/><rect x="108" y="140" width="26" height="12" rx="3"/></g>
      </g>
      <g id="rig-tractor">
        <rect data-part="truck-chassis" x="420" y="60" width="112" height="52" rx="5"/>
        <circle data-part="truck-chassis" class="detail" cx="446" cy="86" r="14"/>
        <rect data-part="truck-transmission" x="498" y="70" width="30" height="32" rx="4"/>
        <rect data-part="truck-cabin" x="530" y="34" width="62" height="104" rx="11"/>
        <rect data-part="truck-engine" x="548" y="56" width="34" height="60" rx="5"/>
        <rect class="mirror" x="580" y="26" width="9" height="8" rx="2"/>
        <rect class="mirror" x="580" y="138" width="9" height="8" rx="2"/>
        <g data-part="truck-wheels"><rect x="426" y="20" width="26" height="12" rx="3"/><rect x="456" y="20" width="26" height="12" rx="3"/><rect x="546" y="20" width="28" height="12" rx="3"/>
          <rect x="426" y="140" width="26" height="12" rx="3"/><rect x="456" y="140" width="26" height="12" rx="3"/><rect x="546" y="140" width="28" height="12" rx="3"/></g>
      </g>
    </svg>
    <div class="legend">
      <span><i class="ok"></i><b data-i18n="condOk"></b></span>
      <span><i class="light"></i><b data-i18n="condLight"></b></span>
      <span><i class="medium"></i><b data-i18n="condMedium"></b></span>
      <span><i class="heavy"></i><b data-i18n="condHeavy"></b></span>
    </div>
    <div class="damage">
      <div><h3 data-i18n="groupTruck"></h3><ul id="damage-truck"></ul></div>
      <div><h3 data-i18n="groupTrailer"></h3><ul id="damage-trailer"></ul></div>
    </div>
  </div>
  <div id="truck-side">
    <div id="job-card" class="card">
      <div class="card-label" data-i18n="job"></div>
      <div id="job-cargo"></div>
      <div id="job-sub"></div>
      <div class="job-route">
        <div class="stop"><span class="pin"></span><div class="place"><b id="job-from"></b><small id="job-from-company"></small></div></div>
        <div class="stop"><span class="pin to"></span><div class="place"><b id="job-to"></b><small id="job-to-company"></small></div></div>
      </div>
      <div class="stats">
        <div><small data-i18n="timeLeft"></small><span id="job-left"></span></div>
        <div><small data-i18n="distance"></small><span id="job-distance"></span></div>
        <div><small data-i18n="pay"></small><span id="job-pay"></span></div>
      </div>
    </div>
    <div id="fuel-card" class="card">
      <div class="fuel-head"><span class="card-label" data-i18n="fuel"></span><span id="fuel-amount"></span></div>
      <div class="fuel-bar"><div id="fuel-level"></div></div>
      <div class="stats">
        <div><small data-i18n="range"></small><span id="fuel-range"></span></div>
        <div><small data-i18n="average"></small><span id="fuel-average"></span></div>
        <div><small data-i18n="adblue"></small><span id="fuel-adblue"></span></div>
      </div>
    </div>
    <div id="gauge-card" class="card">
      <div class="card-label" data-i18n="gauges"></div>
      <div class="stats">
        <div><small data-i18n="oil"></small><span id="gauge-oil"></span></div>
        <div><small data-i18n="coolant"></small><span id="gauge-water"></span></div>
        <div><small data-i18n="battery"></small><span id="gauge-battery"></span></div>
      </div>
    </div>
  </div>
</section>

<!-- Browser: the bar stays visible above the page, which the host lays over everything
     below it; the start page shows while no page is in front. -->
<section id="browser" hidden>
  <div id="browser-bar">
    <button id="bar-start" data-i18n-title="startPage"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></button>
    <button id="bar-reload" data-i18n-title="reload"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4"/></svg></button>
    <input id="bar-address" type="text" spellcheck="false" autocomplete="off">
    <button id="bar-star"><svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg></button>
  </div>
  <div id="browser-start">
    <div class="card-label" data-i18n="shortcuts"></div>
    <div id="browser-sites"></div>
    <p id="browser-hint" data-i18n="favHint"></p>
  </div>
</section>

<!-- Two apps side by side: which one goes in which half. The halves themselves are the
     apps' own views (see render in shell.js); the line between them is drawn here. -->
<section id="split" hidden>
  <div class="split-head">
    <h2 data-i18n="split"></h2>
    <p data-i18n="splitHint"></p>
  </div>
  <div class="split-sides">
    <div class="card split-side">
      <div class="card-label" data-i18n="splitLeft"></div>
      <div id="split-left" class="split-apps"></div>
    </div>
    <button id="split-swap" data-i18n-title="splitSwap"><svg viewBox="0 0 24 24"><path d="M7 8h13l-3.5-3.5M17 16H4l3.5 3.5"/></svg></button>
    <div class="card split-side">
      <div class="card-label" data-i18n="splitRight"></div>
      <div id="split-right" class="split-apps"></div>
    </div>
  </div>
  <div class="split-actions">
    <button id="split-off" class="quiet" data-i18n="splitOff"></button>
    <button id="split-on" data-i18n="splitOn"></button>
  </div>
</section>
<div id="split-line"></div>

<div id="settings" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 data-i18n="settings"></h2>
      <div id="settings-tabs" class="tabs">
        <button data-tab="general" data-i18n="tabGeneral"></button>
        <button data-tab="background" data-i18n="tabBackground"></button>
        <button data-tab="controls" data-i18n="tabControls"></button>
      </div>
    </div>
    <div class="tab" data-tab="general">
      <!-- No <select>: its list opens as a window of its own, which the in-cabin screen does
           not show. These lists and choices are drawn by the page itself (shell.js). -->
      <div class="setting"><span data-i18n="language"></span>
        <div id="settings-language" class="dropdown">
          <button class="dropdown-button"><span></span><svg viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></svg></button>
          <div class="dropdown-list" hidden></div>
        </div></div>
      <div class="setting"><span class="setting-text"><span data-i18n="updates"></span><small id="update-status"></small>
        <button id="settings-update-now" class="update-now" data-i18n="updNow" hidden></button></span>
        <span id="settings-updates" class="choice"><button data-value="auto" data-i18n="updatesOn"></button><button data-value="ask" data-i18n="updatesAsk"></button><button data-value="off" data-i18n="updatesOff"></button></span></div>
      <p data-i18n="hint"></p>
      <div class="tab-actions">
        <button id="settings-diagnostics" class="quiet" data-i18n="diagnostics"></button>
        <button id="settings-quit" class="danger" data-i18n="quit"></button>
      </div>
      <p class="sheet-note" data-i18n="diagnosticsHint"></p>
    </div>
    <!-- Backgrounds: the built-in ones and the user's own pictures, filled in by shell.js. -->
    <div class="tab" data-tab="background" hidden>
      <div id="walls"></div>
      <p data-i18n="wallHint"></p>
    </div>
    <!-- Shortcuts: one row per action (ACTIONS in shell.js), with its key and its
         controller button. -->
    <div class="tab" data-tab="controls" hidden>
      <!-- control mode: its screen size (percent of the game's width) and cursor sensitivity
           (cursor speed in percent, shown as 1.0 for 100) -->
      <div class="ctl-group">
        <div class="ctl-title" data-i18n="ctlGroup"></div>
        <div class="setting"><span data-i18n="ctlSize"></span>
          <span id="settings-size" class="choice"><button data-value="45" data-i18n="sizeS"></button><button data-value="60" data-i18n="sizeM"></button><button data-value="75" data-i18n="sizeL"></button><button data-value="90" data-i18n="sizeXL"></button></span></div>
        <div class="setting"><span data-i18n="ctlSpeed"></span>
          <span id="settings-speed" class="stepper"><button data-step="-10">&minus;</button><input type="range" min="30" max="400" step="10" value="100"><button data-step="10">+</button><b></b></span></div>
      </div>
      <div class="bind-head"><span data-i18n="ctlAction"></span><span data-i18n="ctlKeyboard"></span><span data-i18n="ctlController"></span></div>
      <div id="binds"></div>
      <p data-i18n="ctlHint"></p>
    </div>
    <div class="sheet-actions">
      <button id="settings-reset" class="quiet" data-i18n="ctlReset" hidden></button>
      <button id="settings-close" data-i18n="ok"></button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="apps.js"></script>
<script src="places.js"></script>
<script src="shell.js"></script>
</body>
</html>
