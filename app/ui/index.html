<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CabinPlay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Texts are filled in by shell.js from i18n.js: data-i18n sets the content,
     data-i18n-title the tooltip. -->

<aside id="dock">
  <div id="clock" data-i18n-title="dragTitle">
    <div id="clock-time">--:--</div>
    <div id="clock-date"></div>
  </div>
  <div id="link"><span id="link-dot"></span><span id="link-text"></span></div>
  <div id="dock-apps"></div>
  <div id="dock-nav" hidden>
    <button id="dock-back" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <span class="seg-line"></span>
    <button id="dock-forward" data-i18n-title="forward"><svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
  </div>
  <button id="dock-fullscreen" class="dock-btn" title="Ctrl+Alt+F" hidden>
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="dock-home" class="dock-btn" title="Ctrl+Alt+H">
    <svg viewBox="0 0 24 24" class="filled">
      <rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/>
      <rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/>
    </svg>
  </button>
</aside>

<main id="home">
  <section id="widgets">
    <div id="now-playing" class="card">
      <div class="card-label" data-i18n="nowPlaying"></div>
      <div class="np-body">
        <div id="np-art"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
        <div class="np-text">
          <div id="np-title"></div>
          <div id="np-sub"></div>
        </div>
      </div>
      <div class="np-progress"><div id="np-bar"></div></div>
      <div class="np-times"><span id="np-pos">0:00</span><span id="np-dur">0:00</span></div>
      <div class="np-controls">
        <button data-media="prev" title="Ctrl+Alt+←"><svg viewBox="0 0 24 24" class="filled"><path d="M6 5h2.4v14H6zM20 5.5v13L9.5 12z"/></svg></button>
        <button data-media="playpause" id="np-play" title="Ctrl+Alt+Space"><svg viewBox="0 0 24 24" class="filled"><path id="np-play-icon" d="M7 4.5v15L20 12z"/></svg></button>
        <button data-media="next" title="Ctrl+Alt+→"><svg viewBox="0 0 24 24" class="filled"><path d="M15.6 5H18v14h-2.4zM4 5.5v13L14.5 12z"/></svg></button>
      </div>
    </div>
    <div id="day-card" class="card">
      <div id="day-name"></div>
      <div id="day-date"></div>
    </div>
  </section>

  <section id="grid"></section>
</main>

<section id="maps" hidden>
  <div id="map-speed" class="map-card">
    <div class="speed-now"><span id="map-speed-value">0</span><small data-i18n="speedUnit"></small></div>
    <div id="map-limit" hidden>50</div>
  </div>
  <div id="map-route" class="map-card">
    <div class="route-main"><span id="map-eta">--:--</span><small data-i18n="arrival"></small></div>
    <div class="route-rest"><span id="map-remaining"></span><span id="map-distance"></span></div>
  </div>
  <div id="map-status"></div>
</section>

<!-- Truck page: everything comes from the game's telemetry through the plugin. A part
     marked data-part glows orange or red once it is badly worn (see renderTruck). -->
<section id="truck" hidden>
  <div id="rig-card" class="card">
    <div class="rig-head">
      <div class="rig-title-box">
        <div id="rig-title"></div>
        <div id="rig-sub"></div>
      </div>
      <div id="rig-chips"></div>
    </div>
    <svg id="rig" viewBox="0 0 600 206" aria-hidden="true">
      <defs>
        <linearGradient id="rig-cab" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fbfbfd"/><stop offset=".55" stop-color="#e2e5ea"/><stop offset="1" stop-color="#b7bcc6"/></linearGradient>
        <linearGradient id="rig-box" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f3f5f8"/><stop offset=".6" stop-color="#dce0e6"/><stop offset="1" stop-color="#b6bbc5"/></linearGradient>
        <linearGradient id="rig-rim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f2f3f7"/><stop offset="1" stop-color="#8c909d"/></linearGradient>
        <linearGradient id="rig-glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6b86a6"/><stop offset=".5" stop-color="#2c3a50"/><stop offset="1" stop-color="#1a2232"/></linearGradient>
        <linearGradient id="rig-tank" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f5f6f9"/><stop offset=".5" stop-color="#c3c7cf"/><stop offset="1" stop-color="#8d929d"/></linearGradient>
        <filter id="rig-warn" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff9f0a" flood-opacity=".9"/></filter>
        <filter id="rig-bad" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#ff453a" flood-opacity=".95"/></filter>
      </defs>
      <ellipse class="shadow" cx="302" cy="195" rx="292" ry="6"/>
      <g id="rig-trailer">
        <rect data-part="trailer-chassis" class="frame" x="40" y="138" width="372" height="9" rx="2"/>
        <path data-part="trailer-chassis" class="frame" d="M330 147h6v24h4v4h-14v-4h4z"/>
        <rect data-part="trailer-body" class="box" x="12" y="18" width="396" height="122" rx="6"/>
        <rect class="rail" x="12" y="18" width="396" height="7" rx="3"/>
        <path class="rib" d="M4827v98M8427v98M12027v98M15627v98M19227v98M22827v98M26427v98M30027v98M33627v98M37227v98"/>
        <rect class="rail low" x="12" y="125" width="396" height="15" rx="2"/>
        <path class="contour" d="M19 132.5h383"/>
        <rect class="lamp red" x="12" y="108" width="5" height="13" rx="1.5"/>
        <rect class="steel" x="212" y="150" width="104" height="5" rx="2"/>
        <rect class="flap" x="194" y="150" width="4" height="27" rx="1"/>
        <g data-part="trailer-wheels" class="tire"><circle cx="70" cy="172" r="22"/><circle cx="118" cy="172" r="22"/><circle cx="166" cy="172" r="22"/></g>
        <g class="rim"><circle cx="70" cy="172" r="12.5"/><circle cx="118" cy="172" r="12.5"/><circle cx="166" cy="172" r="12.5"/></g>
        <g class="rim-in"><circle cx="70" cy="172" r="8"/><circle cx="118" cy="172" r="8"/><circle cx="166" cy="172" r="8"/></g>
        <g class="hub"><circle cx="70" cy="172" r="3.2"/><circle cx="118" cy="172" r="3.2"/><circle cx="166" cy="172" r="3.2"/></g>
      </g>
      <g id="rig-tractor">
        <rect data-part="truck-chassis" class="frame" x="404" y="146" width="186" height="11" rx="2"/>
        <path data-part="truck-chassis" class="frame" d="M402 140h52l-3 6h-46z"/>
        <path class="fender" d="M409 151a31 31 0 0 1 62 0h-6a25 25 0 0 0-50 0z"/>
        <rect class="tank" x="470" y="147" width="56" height="20" rx="10"/>
        <path class="strap" d="M484 147v20M512 147v20"/>
        <path data-part="truck-cabin" class="cab" d="M458 150V34q0-14 14-14h81q15 0 20 12l10 56q5 8 5 18l2 44z"/>
        <path class="well" d="M530.2 150A27 27 0 0 1 581.8 150z"/>
        <rect class="skirt" x="458" y="137" width="68" height="13" rx="2"/>
        <path class="glass" d="M498 44h54q5 0 6 6l3 40h-67q0-30 4-46z"/>
        <path class="glass" d="M566 30q7 1 9 10l9 50q1 3 1 6h-13z"/>
        <path class="seam" d="M490 38v99M563 96v41"/>
        <rect class="steel" x="544" y="98" width="12" height="3" rx="1.5"/>
        <path class="visor" d="M555 21q16 1 20 12h-9q-3-7-11-7z"/>
        <g class="beacon"><rect x="482" y="16" width="9" height="4" rx="1.5"/><rect x="498" y="16" width="9" height="4" rx="1.5"/><rect x="514" y="16" width="9" height="4" rx="1.5"/><rect x="530" y="16" width="9" height="4" rx="1.5"/></g>
        <rect class="grille" x="580" y="98" width="8" height="27" rx="2"/>
        <path class="slats" d="M581 104h6M581 110h6M581 116h6"/>
        <rect class="lamp" x="577" y="127" width="12" height="7" rx="2"/>
        <rect class="lamp amber" x="571" y="128" width="4" height="5" rx="1"/>
        <rect data-part="truck-cabin" class="bumper" x="566" y="136" width="26" height="16" rx="3"/>
        <path class="mirror-arm" d="M584 56h7"/>
        <rect class="mirror" x="590" y="45" width="6" height="31" rx="2"/>
        <rect data-part="truck-transmission" class="xray" x="492" y="110" width="30" height="24" rx="4"/>
        <rect data-part="truck-engine" class="xray" x="526" y="102" width="40" height="32" rx="5"/>
        <g data-part="truck-wheels" class="tire"><circle cx="440" cy="172" r="23"/><circle cx="556" cy="172" r="23"/></g>
        <g class="rim"><circle cx="440" cy="172" r="13"/><circle cx="556" cy="172" r="13"/></g>
        <g class="rim-in"><circle cx="440" cy="172" r="8.5"/><circle cx="556" cy="172" r="8.5"/></g>
        <g class="hub"><circle cx="440" cy="172" r="3.4"/><circle cx="556" cy="172" r="3.4"/></g>
      </g>
    </svg>
    <div class="damage">
      <div><h3 data-i18n="groupTruck"></h3><ul id="damage-truck"></ul></div>
      <div><h3 data-i18n="groupTrailer"></h3><ul id="damage-trailer"></ul></div>
    </div>
  </div>
  <div id="truck-side">
    <div id="job-card" class="card">
      <div class="card-label" data-i18n="job"></div>
      <div id="job-cargo"></div>
      <div id="job-sub"></div>
      <div class="job-route">
        <div class="stop"><span class="pin"></span><div class="place"><b id="job-from"></b><small id="job-from-company"></small></div></div>
        <div class="stop"><span class="pin to"></span><div class="place"><b id="job-to"></b><small id="job-to-company"></small></div></div>
      </div>
      <div class="stats">
        <div><small data-i18n="timeLeft"></small><span id="job-left"></span></div>
        <div><small data-i18n="distance"></small><span id="job-distance"></span></div>
        <div><small data-i18n="pay"></small><span id="job-pay"></span></div>
      </div>
    </div>
    <div id="fuel-card" class="card">
      <div class="fuel-head"><span class="card-label" data-i18n="fuel"></span><span id="fuel-amount"></span></div>
      <div class="fuel-bar"><div id="fuel-level"></div></div>
      <div class="stats">
        <div><small data-i18n="range"></small><span id="fuel-range"></span></div>
        <div><small data-i18n="average"></small><span id="fuel-average"></span></div>
        <div><small data-i18n="adblue"></small><span id="fuel-adblue"></span></div>
      </div>
    </div>
    <div id="gauge-card" class="card">
      <div class="card-label" data-i18n="gauges"></div>
      <div class="stats">
        <div><small data-i18n="oil"></small><span id="gauge-oil"></span></div>
        <div><small data-i18n="coolant"></small><span id="gauge-water"></span></div>
        <div><small data-i18n="battery"></small><span id="gauge-battery"></span></div>
      </div>
    </div>
  </div>
</section>

<div id="settings" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 data-i18n="settings"></h2>
      <label><span data-i18n="language"></span> <select id="settings-language"></select></label>
    </div>
    <table>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd data-i18n="keySpace"></kbd></td><td data-i18n="scPlayPause"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>→</kbd> <kbd>←</kbd></td><td data-i18n="scNextPrev"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>↑</kbd> <kbd>↓</kbd></td><td data-i18n="scSeek"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>F</kbd></td><td data-i18n="scFullscreen"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>H</kbd> <kbd>N</kbd></td><td data-i18n="scHomeNav"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>C</kbd></td><td data-i18n="scControl"></td></tr>
    </table>
    <p data-i18n="hint"></p>
    <div class="sheet-actions">
      <button id="settings-quit" class="danger" data-i18n="quit"></button>
      <button id="settings-diagnostics" class="quiet" data-i18n="diagnostics"></button>
      <button id="settings-close" data-i18n="ok"></button>
    </div>
    <p class="sheet-note" data-i18n="diagnosticsHint"></p>
  </div>
</div>

<script src="i18n.js"></script>
<script src="apps.js"></script>
<script src="places.js"></script>
<script src="shell.js"></script>
</body>
</html>
