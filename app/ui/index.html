<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CabinPlay</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Texts are filled in by shell.js from i18n.js: data-i18n sets the content,
     data-i18n-title the tooltip. -->

<aside id="dock">
  <div id="clock" data-i18n-title="dragTitle">
    <div id="clock-time">--:--</div>
    <div id="clock-date"></div>
  </div>
  <div id="link"><span id="link-dot"></span><span id="link-text"></span></div>
  <div id="dock-apps"></div>
  <div id="dock-nav" hidden>
    <button id="dock-back" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <span class="seg-line"></span>
    <button id="dock-forward" data-i18n-title="forward"><svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
  </div>
  <button id="dock-fullscreen" class="dock-btn" title="Ctrl+Alt+F" hidden>
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button id="dock-home" class="dock-btn" title="Ctrl+Alt+H">
    <svg viewBox="0 0 24 24" class="filled">
      <rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/>
      <rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/>
    </svg>
  </button>
</aside>

<main id="home">
  <section id="widgets">
    <div id="now-playing" class="card">
      <div class="card-label" data-i18n="nowPlaying"></div>
      <div class="np-body">
        <div id="np-art"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
        <div class="np-text">
          <div id="np-title"></div>
          <div id="np-sub"></div>
        </div>
      </div>
      <div class="np-progress"><div id="np-bar"></div></div>
      <div class="np-times"><span id="np-pos">0:00</span><span id="np-dur">0:00</span></div>
      <div class="np-controls">
        <button data-media="prev" title="Ctrl+Alt+←"><svg viewBox="0 0 24 24" class="filled"><path d="M6 5h2.4v14H6zM20 5.5v13L9.5 12z"/></svg></button>
        <button data-media="playpause" id="np-play" title="Ctrl+Alt+Space"><svg viewBox="0 0 24 24" class="filled"><path id="np-play-icon" d="M7 4.5v15L20 12z"/></svg></button>
        <button data-media="next" title="Ctrl+Alt+→"><svg viewBox="0 0 24 24" class="filled"><path d="M15.6 5H18v14h-2.4zM4 5.5v13L14.5 12z"/></svg></button>
      </div>
    </div>
    <div id="day-card" class="card">
      <div id="day-name"></div>
      <div id="day-date"></div>
    </div>
  </section>

  <section id="grid"></section>
</main>

<section id="maps" hidden>
  <div id="map-speed" class="map-card">
    <div class="speed-now"><span id="map-speed-value">0</span><small data-i18n="speedUnit"></small></div>
    <div id="map-limit" hidden>50</div>
  </div>
  <div id="map-route" class="map-card">
    <div class="route-main"><span id="map-eta">--:--</span><small data-i18n="arrival"></small></div>
    <div class="route-rest"><span id="map-remaining"></span><span id="map-distance"></span></div>
  </div>
  <div id="map-status"></div>
</section>

<!-- Truck page: everything comes from the game's telemetry through the plugin. Parts
     marked data-part are outlined in the colour of their wear (see renderTruck). -->
<section id="truck" hidden>
  <div id="rig-card" class="card">
    <div class="rig-head">
      <div class="rig-title-box">
        <div id="rig-title"></div>
        <div id="rig-sub"></div>
      </div>
      <div id="rig-chips"></div>
    </div>
    <svg id="rig" viewBox="0 0 600 206" aria-hidden="true">
      <defs>
        <linearGradient id="rig-rim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eceef4"/><stop offset="1" stop-color="#8b8f9d"/></linearGradient>
        <linearGradient id="rig-glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c4e1ff" stop-opacity=".8"/><stop offset="1" stop-color="#4d6fa6" stop-opacity=".4"/></linearGradient>
        <linearGradient id="rig-shine" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <ellipse class="shadow" cx="302" cy="198" rx="292" ry="7"/>
      <g id="rig-trailer">
        <rect data-part="trailer-body" x="14" y="22" width="390" height="116" rx="9"/>
        <rect class="shine" x="17" y="25" width="384" height="52" rx="7"/>
        <path class="seam" d="M6230v100M11030v100M15830v100M20630v100M25430v100M30230v100M35030v100"/>
        <rect class="lamp red" x="17" y="121" width="5" height="11" rx="2"/>
        <rect data-part="trailer-chassis" x="14" y="140" width="406" height="10" rx="3"/>
        <rect class="steel" x="214" y="151" width="72" height="5" rx="2"/>
        <path data-part="trailer-chassis" d="M300 150h7v23h5v5h-17v-5h5z"/>
        <circle data-part="trailer-wheels" cx="84" cy="175" r="21"/>
        <circle data-part="trailer-wheels" cx="132" cy="175" r="21"/>
        <circle data-part="trailer-wheels" cx="180" cy="175" r="21"/>
        <g class="rim"><circle cx="84" cy="175" r="11.5"/><circle cx="132" cy="175" r="11.5"/><circle cx="180" cy="175" r="11.5"/></g>
        <g class="hubcap"><circle cx="84" cy="175" r="3.5"/><circle cx="132" cy="175" r="3.5"/><circle cx="180" cy="175" r="3.5"/></g>
      </g>
      <g id="rig-tractor">
        <rect data-part="truck-chassis" x="408" y="150" width="182" height="11" rx="3"/>
        <path data-part="truck-chassis" d="M408 141h50l-4 9h-42z"/>
        <path data-part="truck-cabin" d="M476 31q6-18 34-19h42q15 0 21 19z"/>
        <path data-part="truck-cabin" d="M456 150V52q0-21 21-21h80q19 0 24 15l7 50 3 54z"/>
        <rect class="shine" x="459" y="33" width="118" height="40" rx="12"/>
        <path class="glass" d="M500 42h54q5 0 5 5v40h-63q-1-27 4-45z"/>
        <path class="glass" d="M567 38q9 1 12 10l6 44h-14z"/>
        <path class="seam" d="M490 36v112M563 96v52"/>
        <rect class="steel" x="547" y="99" width="11" height="3" rx="1.5"/>
        <path class="steel" d="M586 58h4v-6h5v32h-5v-20h-4z"/>
        <path class="seam" d="M574 103h13M575 109h13M576 115h12"/>
        <rect class="lamp" x="578" y="121" width="11" height="7" rx="2"/>
        <rect data-part="truck-cabin" x="565" y="135" width="27" height="17" rx="5"/>
        <rect data-part="truck-transmission" class="inner" x="494" y="118" width="32" height="22" rx="4"/>
        <rect data-part="truck-engine" class="inner" x="530" y="108" width="34" height="32" rx="5"/>
        <rect class="tank" x="468" y="143" width="60" height="18" rx="8"/>
        <circle data-part="truck-wheels" cx="440" cy="175" r="22"/>
        <circle data-part="truck-wheels" cx="556" cy="175" r="22"/>
        <g class="rim"><circle cx="440" cy="175" r="12"/><circle cx="556" cy="175" r="12"/></g>
        <g class="hubcap"><circle cx="440" cy="175" r="3.8"/><circle cx="556" cy="175" r="3.8"/></g>
      </g>
    </svg>
    <div class="damage">
      <div><h3 data-i18n="groupTruck"></h3><ul id="damage-truck"></ul></div>
      <div><h3 data-i18n="groupTrailer"></h3><ul id="damage-trailer"></ul></div>
    </div>
  </div>
  <div id="truck-side">
    <div id="job-card" class="card">
      <div class="card-label" data-i18n="job"></div>
      <div id="job-cargo"></div>
      <div id="job-sub"></div>
      <div class="job-route">
        <div class="stop"><span class="pin"></span><span id="job-from"></span></div>
        <div class="stop"><span class="pin to"></span><span id="job-to"></span></div>
      </div>
      <div class="stats">
        <div><small data-i18n="timeLeft"></small><span id="job-left"></span></div>
        <div><small data-i18n="distance"></small><span id="job-distance"></span></div>
        <div><small data-i18n="pay"></small><span id="job-pay"></span></div>
      </div>
    </div>
    <div id="fuel-card" class="card">
      <div class="fuel-head"><span class="card-label" data-i18n="fuel"></span><span id="fuel-amount"></span></div>
      <div class="fuel-bar"><div id="fuel-level"></div></div>
      <div class="stats">
        <div><small data-i18n="range"></small><span id="fuel-range"></span></div>
        <div><small data-i18n="average"></small><span id="fuel-average"></span></div>
        <div><small data-i18n="adblue"></small><span id="fuel-adblue"></span></div>
      </div>
    </div>
    <div id="gauge-card" class="card">
      <div class="card-label" data-i18n="gauges"></div>
      <div class="stats">
        <div><small data-i18n="oil"></small><span id="gauge-oil"></span></div>
        <div><small data-i18n="coolant"></small><span id="gauge-water"></span></div>
        <div><small data-i18n="battery"></small><span id="gauge-battery"></span></div>
      </div>
    </div>
  </div>
</section>

<div id="settings" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 data-i18n="settings"></h2>
      <label><span data-i18n="language"></span> <select id="settings-language"></select></label>
    </div>
    <table>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd data-i18n="keySpace"></kbd></td><td data-i18n="scPlayPause"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>→</kbd> <kbd>←</kbd></td><td data-i18n="scNextPrev"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>↑</kbd> <kbd>↓</kbd></td><td data-i18n="scSeek"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>F</kbd></td><td data-i18n="scFullscreen"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>H</kbd> <kbd>N</kbd></td><td data-i18n="scHomeNav"></td></tr>
      <tr><td><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>C</kbd></td><td data-i18n="scControl"></td></tr>
    </table>
    <p data-i18n="hint"></p>
    <div class="sheet-actions">
      <button id="settings-quit" class="danger" data-i18n="quit"></button>
      <button id="settings-diagnostics" class="quiet" data-i18n="diagnostics"></button>
      <button id="settings-close" data-i18n="ok"></button>
    </div>
    <p class="sheet-note" data-i18n="diagnosticsHint"></p>
  </div>
</div>

<script src="i18n.js"></script>
<script src="apps.js"></script>
<script src="shell.js"></script>
</body>
</html>
