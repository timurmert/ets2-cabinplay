# Keeps the README's download badge working without shields.io having to query
# GitHub itself (its shared GitHub token pool runs dry and the badge then reads
# "invalid"). The total is counted here with this repo's own token and written to
# downloads.json on the orphan "badges" branch; the README badge reads that file
# through shields.io's endpoint badge.
name: Download badge

on:
  schedule:
    - cron: "17 */3 * * *"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Count release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[].assets[].download_count] | add // 0' | awk '{s += $1} END {print s + 0}')
          echo "Total downloads: $total"
          mkdir out
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"2ea44f"}\n' "$total" > out/downloads.json

      - name: Publish to the badges branch
        working-directory: out
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git commit -q -m "Download count"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
